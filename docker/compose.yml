# Tickvana + Nuvenna behind Caddy.
#
#   cp .env.example .env    # then edit
#   docker compose up -d                      # with your own database (DB_URL)
#   docker compose --profile with-db up -d    # with the bundled PostgreSQL
name: tvn

x-app: &app
  env_file: .env
  environment:
    TRUST_PROXY: "true" # Caddy sits in front
  volumes:
    - data:/data
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
      required: false

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [tickvana, nuvenna]

  tickvana:
    <<: *app
    image: ghcr.io/spidobot/tickvana:${TVN_VERSION:-latest}
    build:
      { context: .., dockerfile: docker/Dockerfile, args: { APP: tickvana } }

  nuvenna:
    <<: *app
    image: ghcr.io/spidobot/nuvenna:${TVN_VERSION:-latest}

  db:
    image: postgres:16
    profiles: [with-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvn
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: tvn
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?set QUERY_DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvn -d tvn"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  data:
  db:
  caddy:
