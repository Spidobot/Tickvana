name: Release

# A tag vX.Y.Z builds both images, pushes them to the GitHub Container
# Registry as ghcr.io/<owner>/tickvana:X.Y.Z and ghcr.io/<owner>/nuvenna:X.Y.Z
# (and :X.Y, :latest), and signs them with Sigstore cosign, keyless through
# GitHub's OIDC identity. No secrets needed. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write # push to ghcr.io
  id-token: write # keyless signing

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tickvana]
    steps:
      - uses: actions/checkout@v4
      # Registry names are lower case; the account may not be.
      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.app }}@${DIGEST}"

  notes:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the change log
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
